el.onclick=e=>{const t=e.target.closest('.mc');if(!t||lock||t==f||t.classList.contains('done'))return;t.classList.add('up');if(!f){f=t;return}

sopa(b,el){const n=17,ws0=b.w.map(x=>x[0]).sort((a,c)=>c.length-a.length),ws=[],g=Array.from({length:n},()=>Array(n).fill(''));
ws0.forEach(w=>{for(let k=0;k<800;k++){const d=Math.random()<.5?[0,1]:[1,0],r=rnd(n-d[0]*(w.length-1)),c=rnd(n-d[1]*(w.length-1));if([...w].every((ch,i)=>{const v=g[r+d[0]*i][c+d[1]*i];return !v||v==ch})){[...w].forEach((ch,i)=>g[r+d[0]*i][c+d[1]*i]=ch);ws.push(w);break}}});

st.classList.remove('a');const r1=+st.dataset.r,c1=+st.dataset.c,r2=+t.dataset.r,c2=+t.dataset.c;st=null;if(r1!=r2&&c1!=c2)return;
const L=Math.max(Math.abs(r2-r1),Math.abs(c2-c1))+1,dr=Math.sign(r2-r1),dc=Math.sign(c2-c1),cells=[];let s='';for(let i=0;i<L;i++){cells.push(el.querySelector(`td[data-r="${r1+dr*i}"][data-c="${c1+dc*i}"]`));s+=g[r1+dr*i][c1+dc*i]}
const w=ws.find(x=>x==s||x==[...s].reverse().join(''));if(w){cells.forEach(c=>c.classList.add('f'));el.querySelector('#w_'+w).classList.add('f')}}},
cruci(b,el){const g={},it=[],ok=(w,r,c,d)=>{const dr=d,dc=1-d;if(g[(r-dr)+','+(c-dc)]||g[(r+dr*w.length)+','+(c+dc*w.length)])return 0;let x=0;for(let i=0;i<w.length;i++){const R=r+dr*i,C=c+dc*i,k=R+','+C;if(g[k]){if(g[k]!=w[i])return 0;x++}else if(g[(R+dc)+','+(C+dr)]||g[(R-dc)+','+(C-dr)])return 0}return x&&x<w.length},put=(w,r,c,d,cl)=>{[...w].forEach((ch,i)=>g[(r+d*i)+','+(c+(1-d)*i)]=ch);it.push({w,r,c,d,cl})};

const ks=Object.keys(g).map(k=>k.split(',').map(Number)),r0=Math.min(...ks.map(k=>k[0])),c0=Math.min(...ks.map(k=>k[1])),R=Math.max(...ks.map(k=>k[0]))-r0+1,C=Math.max(...ks.map(k=>k[1]))-c0+1;

for(let i=0;i<R;i++){h+='<tr>';for(let j=0;j<C;j++){const k=(i+r0)+','+(j+c0);h+=g[k]?`<td class=c><i>${starts[k]||''}</i><input maxlength=1 data-a="${g[k]}"></td>`:'<td class=c style="border:0"></td>'}h+='</tr>'}
const li=d=>it.filter(x=>x.d==d).sort((a,c)=>a.n-c.n).map(x=>`<li value=${x.n}>${x.cl} (${x.w.length})</li>`).join('');
el.innerHTML=h+`</table></div><button class=go>Revisar</button><div class=card><b>➡️ Horizontales</b><ol>${li(0)}</ol><b>⬇️ Verticales</b><ol>${li(1)}</ol></div>`;
el.querySelector('.go').onclick=()=>el.querySelectorAll('input').forEach(i=>{i.className=i.value.toUpperCase()==i.dataset.a?'ok':(i.value?'bad':'')})}};

const C=['#ff5a5f','#ff9f1c','#2ec4b6','#3a86ff','#8338ec','#ff006e'];
const T=[
{n:'1',t:'Los riñones: localización y estructura',e:'🫘',intro:'Los riñones mantienen la pureza y constancia de los fluidos internos. Son órganos en forma de frijol, de unos 12 cm de largo, situados en la pared dorsal del cuerpo, detrás del peritoneo (retroperitoneales), entre las vértebras T12 y L3. El derecho queda un poco más abajo por el hígado.',
pts:['<b>Cubiertas:</b> cápsula fibrosa, cápsula grasa perirrenal y fascia renal','<b>Regiones:</b> corteza, médula (pirámides y columnas renales) y pelvis renal con sus cálices','<b>Irrigación:</b> reciben cerca de un cuarto de la sangre total cada minuto por la arteria renal','<b>Otras funciones:</b> producen renina y eritropoyetina y activan la vitamina D'],keys:['Retroperitoneal','Hilio renal','Corteza y médula','Arteria renal'],
ex:[['🏊','Filtro de piscina','Los riñones limpian la sangre sin parar; si fallan, se acumulan desechos como en una piscina sin filtro.'],['🛡️','Colchón de grasa','La grasa que rodea al riñón lo protege de golpes; si se pierde peso muy rápido, el riñón puede descender (ptosis).']],
q:[['¿Qué significa que los riñones sean retroperitoneales?',['Están dentro del peritoneo','Están detrás del peritoneo parietal','Están sobre el diafragma','Están unidos al estómago'],1],['¿Entre qué vértebras se extienden los riñones?',['C7 y T4','T12 y L3','L4 y S1','T6 y T10'],1],['¿Qué capa es la más externa y transparente, y le da aspecto brillante al riñón?',['Fascia renal','Cápsula grasa perirrenal','Cápsula fibrosa','Corteza renal'],2],['Las columnas renales son:',['Extensiones de la corteza entre las pirámides','Vasos de la médula','Cálices mayores','Partes del uréter'],0],['La arteria renal se divide primero en:',['Arterias arciformes','Arterias segmentarias','Arteriolas aferentes','Arterias radiales corticales'],1],['¿Qué hormona del riñón estimula la producción de glóbulos rojos?',['Renina','Aldosterona','Eritropoyetina','ADH'],2]],
w:[['RINON','Órgano en forma de frijol que filtra la sangre','Riñón'],['HILIO','Hendidura por donde entran y salen vasos y uréter'],['CORTEZA','Región externa del riñón'],['MEDULA','Región interna con pirámides','Médula'],['PIRAMIDE','Estructura triangular de la médula','Pirámide'],['CALIZ','Copa que recoge la orina','Cáliz'],['PELVIS','Cavidad plana donde confluyen los cálices'],['CAPSULA','Cubierta fibrosa que envuelve el riñón','Cápsula'],['RENINA','Enzima que ayuda a regular la presión arterial'],['COLUMNAS','Extensiones de la corteza entre las pirámides'],['ARTERIA','Vaso que lleva sangre al riñón'],['ERITROPOYETINA','Hormona que estimula los glóbulos rojos']]},
{n:'2',t:'Nefronas y formación de la orina',e:'🔬',intro:'Cada riñón tiene más de un millón de nefronas, sus unidades funcionales. Cada una tiene un glomérulo (nudo de capilares) y un túbulo renal. La orina se forma por tres procesos: filtración glomerular, reabsorción tubular y secreción tubular.',

{n:'3',t:'Características de la orina',e:'💛',intro:'En 24 horas los riñones filtran entre 150 y 180 litros de plasma, pero solo se producen entre 1 y 1.8 litros de orina. El filtrado pierde casi toda el agua y los nutrientes; lo que queda, la orina, contiene desechos nitrogenados y sustancias innecesarias.',

{n:'4',t:'Uréteres, vejiga, uretra y micción',e:'🚰',intro:'Los uréteres llevan la orina de los riñones a la vejiga; la vejiga la almacena temporalmente y la uretra la conduce al exterior. La micción es el vaciado de la vejiga y se controla con dos esfínteres.',

{n:'5',t:'Equilibrio de fluidos y electrolitos',e:'💦',intro:'El agua es cerca del 60 % del peso en hombres y 50 % en mujeres. Dos tercios están en el líquido intracelular y un tercio en el extracelular (plasma y líquido intersticial). Los riñones, con ayuda de hormonas, mantienen estable el balance de agua y sales; recuerda que el agua sigue a la sal.',

q:[['¿Qué porcentaje del peso corporal es agua en un hombre adulto joven?',['20 %','40 %','60 %','75 %'],2],['¿Dónde se libera la hormona antidiurética (ADH)?',['Corteza suprarrenal','Pituitaria posterior','Páncreas','Médula renal'],1],['La ADH provoca que los conductos colectores:',['Eliminen más agua','Reabsorban más agua','Secreten más sodio','Produzcan renina'],1],['La aldosterona se produce en:',['El hipotálamo','La corteza suprarrenal','El riñón','La hipófisis anterior'],1],['La diabetes insípida se debe a:',['Falta de insulina','Falta de ADH','Exceso de aldosterona','Pérdida de sodio'],1],['La mayor pérdida diaria de agua ocurre por:',['Sudor','Heces','Orina','Pulmones'],2],['¿Qué regla resume la acción de la aldosterona?',['El agua sigue a la sal','El agua sigue a la glucosa','La sal sigue al agua siempre','El agua no depende del sodio'],0]],

{n:'6',t:'Equilibrio ácido-base, desarrollo y envejecimiento',e:'🧬',intro:'El pH de la sangre debe mantenerse entre 7.35 y 7.45: por debajo hay acidosis y por encima alcalosis. Los amortiguadores químicos actúan al instante, los pulmones eliminan CO₂ y los riñones asumen la mayor parte de la carga ácido-base. Con la edad, el riñón pierde función.',

T.forEach((t,k)=>$('#lab'+k+' .lt button').click());
